spring.application.name=AutoEscola3ESPH
server.port=8085

# ---------- Banco de dados (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/autoescola3esph
spring.datasource.username=root
spring.datasource.password=fiap
spring.jpa.open-in-view=false

# ---------- Segurança / JWT ----------
api.security.token.secret=${JWT_SECRET:12345678}
api.security.token.expiration-minutes=120

# ---------- CORS ----------
api.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8085
api.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
api.cors.allowed-headers=Authorization,Content-Type,Accept,Origin
api.cors.exposed-headers=Location
api.cors.allow-credentials=true
api.cors.max-age=3600

# ---------- Consumo de WebService externo (ViaCEP) ----------
api.integracao.viacep.url=https://viacep.com.br/ws

# ---------- Documentação (Swagger / OpenAPI) ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
