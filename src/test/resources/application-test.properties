# Perfil de testes: banco H2 em memoria, sem dependencia de um MySQL local.
spring.datasource.url=jdbc:h2:mem:autoescola;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.flyway.enabled=false

api.security.token.secret=segredo-de-teste
api.security.token.expiration-minutes=10
api.integracao.viacep.url=http://localhost:9999/ws-inexistente
